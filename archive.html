<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project archive | Andrei Jullian Nacaya</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/motion.css">
    <link rel="stylesheet" href="css/intro.css">
    <link rel="stylesheet" href="css/polish-preview.css">
    <link rel="stylesheet" href="css/home-refinement.css">
</head>
<body class="bg-[#030303] text-white"><header style="padding:1.2rem 5%;"><a href="index.html#projects">← Back to selected work</a></header><main><section id="projects" class="relative min-h-screen w-full overflow-hidden flex flex-col items-center justify-start pt-24 pb-32 transition-colors duration-700 ease-out bg-[#030303]">
        <div id="carousel-glow" class="absolute w-[500px] h-[500px] rounded-full blur-[160px] opacity-20 -z-10 transition-colors duration-700"></div>

        <div class="absolute inset-0 flex items-center justify-center select-none pointer-events-none z-0 overflow-hidden max-h-[600px]">
            <h2 class="font-['Anton'] uppercase text-white/[0.02] text-center leading-none tracking-tighter scale-y-110" style="font-size: clamp(6rem, 22vw, 32rem);">
                PROJECTS
            </h2>
        </div>

        <div id="carousel-container" class="relative w-full max-w-7xl h-[480px] flex items-center justify-center px-4 z-10"></div>

        <div class="w-full max-w-7xl px-6 md:px-16 flex justify-between items-center z-20 mt-4 mb-12">
            <div class="flex gap-4">
                <button id="prev-btn" class="w-12 h-12 sm:w-14 sm:h-14 rounded-full border border-blue-500/20 bg-blue-950/10 backdrop-blur-md flex items-center justify-center text-blue-400 hover:bg-blue-600 hover:text-white hover:border-blue-500 hover:shadow-[0_0_20px_rgba(37,99,235,0.4)] transition-all duration-300 transform active:scale-95" aria-label="Previous Project">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
                        <path d="M19 12H5M12 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button id="next-btn" class="w-12 h-12 sm:w-14 sm:h-14 rounded-full border border-blue-500/20 bg-blue-950/10 backdrop-blur-md flex items-center justify-center text-blue-400 hover:bg-blue-600 hover:text-white hover:border-blue-500 hover:shadow-[0_0_20px_rgba(37,99,235,0.4)] transition-all duration-300 transform active:scale-95" aria-label="Next Project">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6 fill-none stroke-current stroke-2" viewBox="0 0 24 24">
                        <path d="M5 12h14M12 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>

            <a id="project-marquee-link" href="#" class="group overflow-hidden border border-blue-500/20 bg-blue-950/20 backdrop-blur-sm py-3 px-6 rounded-full max-w-[180px] sm:max-w-xs flex items-center transition-all hover:border-blue-400 hover:shadow-[0_0_15px_rgba(37,99,235,0.2)]">
                <div class="marquee-track flex whitespace-nowrap gap-4 font-['Anton'] tracking-wider text-xs uppercase text-blue-400 group-hover:text-blue-300">
                    <span>VIEW LIVE ↗ &nbsp;&nbsp; VIEW LIVE ↗ &nbsp;&nbsp; VIEW LIVE ↗</span>
                    <span aria-hidden="true">VIEW LIVE ↗ &nbsp;&nbsp; VIEW LIVE ↗ &nbsp;&nbsp; VIEW LIVE ↗</span>
                </div>
            </a>
        </div>

        <div class="relative w-full max-w-7xl px-6 md:px-16 z-20 mt-8 border-t border-white/5 pt-12">
            <h3 class="text-xl font-bold tracking-tight text-white mb-6 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-blue-500"></span> Archive
            </h3>
            <div id="archive-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </div>
    </section>

    <div id="project-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-500 ease-out bg-[#030303]/80 backdrop-blur-xl">
        <div class="relative w-full max-w-5xl h-[85vh] md:h-[75vh] bg-[#0a0a0a] border border-white/10 rounded-3xl overflow-hidden flex flex-col md:flex-row shadow-[0_0_50px_rgba(0,0,0,0.8)] opacity-0 scale-95 transition-all duration-500 cubic-bezier(0.25, 1, 0.5, 1)" id="modal-content">
            
            <button id="modal-close" class="absolute top-4 right-4 z-50 w-10 h-10 rounded-full bg-black/40 border border-white/10 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 transition">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <div class="w-full md:w-3/5 h-1/2 md:h-full bg-black/40 flex flex-col justify-between p-6 border-b md:border-b-0 md:border-r border-white/5 relative">
                <div class="flex-grow flex items-center justify-center overflow-hidden rounded-2xl border border-white/5 bg-white/[0.01] p-4">
                    <img id="modal-main-img" src="" alt="Showcase layout viewport" class="max-w-full max-h-full object-contain filter drop-shadow-2xl select-none">
                </div>
                <div id="modal-thumbs-track" class="flex gap-3 mt-4 overflow-x-auto py-1 whitespace-nowrap min-h-[60px]"></div>
            </div>

            <div class="w-full md:w-2/5 h-1/2 md:h-full p-6 sm:p-8 flex flex-col justify-between overflow-y-auto bg-gradient-to-b from-transparent to-white/[0.01]">
                <div class="flex flex-col gap-4">
                    <div>
                        <span id="modal-tag" class="font-['Anton'] tracking-widest text-xs text-blue-400 uppercase"></span>
                        <h3 id="modal-title" class="font-['Anton'] text-2xl sm:text-4xl uppercase tracking-tight text-white mt-1 leading-none"></h3>
                    </div>
                    <div class="w-full h-px bg-white/5"></div>
                    <div>
                        <h4 class="text-xs uppercase tracking-wider text-gray-500 font-bold mb-1">Project Details</h4>
                        <p id="modal-desc" class="text-sm font-normal text-gray-400 leading-relaxed font-sans"></p>
                    </div>
                </div>

                <div class="flex flex-col gap-4 mt-8">
                    <div id="modal-specs-box" class="flex flex-wrap gap-2"></div>
                    <a id="modal-action-btn" href="#" target="_blank" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold shadow-[0_0_25px_rgba(37,99,235,0.3)] hover:shadow-[0_0_35px_rgba(37,99,235,0.5)] text-center transition transform active:scale-[0.98] flex items-center justify-center gap-2 text-sm text-white">
                        Launch Live Application <i data-lucide="external-link" class="w-4 h-4"></i>
                    </a>
                </div>
            </div>

        </div>
    </div>

    </main><script src="js/main.js"></script></body></html>
